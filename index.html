<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f7a3d" />
<meta name="description" content="Sahayak — a voice-first assistant that helps gig and daily-wage workers find the government benefit they qualify for, in 6 Indian languages." />
<title>Sahayak — Government Benefits for Gig Workers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f7a3d'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white'%3E%E0%A4%B8%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ============ START OVERLAY ============ -->
<div id="overlay">
  <div class="brand">Saha<span>yak</span></div>
  <div class="tagline">Your helper for government benefits. Talk to me in your language and I will find the scheme that fits you.</div>
  <div class="choose">Choose your language / अपनी भाषा चुनें</div>
  <div class="lang-grid" id="langGrid"></div>
  <div class="overlay-note">Voice works best in Chrome or Edge, and needs a secure (https) page. You can also type your answers.</div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <div class="logo">स</div>
    <div class="h-group">
      <div class="h-title">Sahayak</div>
      <div class="h-sub" id="hSub">Government benefits helper</div>
    </div>
    <div class="spacer"></div>
    <select id="langSelect" aria-label="Language"></select>
    <button id="restart" title="Start again">Restart</button>
  </header>
  <div class="progress"><div id="progressBar"></div></div>

  <main id="chat" aria-live="polite"></main>
  <div id="status"></div>

  <footer>
    <button id="mic" aria-label="Speak">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <input id="text" type="text" autocomplete="off" placeholder="Type here…" />
    <button id="send" aria-label="Send">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </footer>
</div>

<script src="js/languages.js"></script>
<script src="js/schemes.js"></script>
<script src="js/parser.js"></script>
<script src="js/speech.js"></script>
<script src="js/app.js"></script>
</body>
</html>
